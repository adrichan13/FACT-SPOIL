<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPOIL!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    #tap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      gap: 28px;
    }
    #tap svg {
      width: 90px;
      height: 90px;
      fill: #fff;
      opacity: 0.9;
    }
    #tap span {
      color: #fff;
      font-family: sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div id="tap">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 5v14l11-7z"/>
    </svg>
    <span>SPOIL!</span>
  </div>
  <video
    src="https://raw.githubusercontent.com/adrichan13/FACT-SPOIL/main/FACT%20SPOIL.mp4"
    playsinline
    controls
    preload="auto"
  ></video>
  <script>
    const tap = document.getElementById('tap');
    const v = document.querySelector('video');
    tap.addEventListener('click', () => {
      tap.style.display = 'none';
      v.style.display = 'block';
      v.muted = false;
      v.play();
    });
  </script>
</body>
</html>
