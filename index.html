<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPOIL!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video
    src="https://raw.githubusercontent.com/adrichan13/FACT-SPOIL/main/FACT%20SPOIL.mp4"
    autoplay
    playsinline
    controls
    preload="auto"
  ></video>
  <script>
    const v = document.querySelector('video');
    v.play().catch(() => {
      v.muted = true;
      v.play();
    });
  </script>
</body>
</html>
